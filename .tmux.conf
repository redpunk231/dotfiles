setw -g mode-keys vi
set-option -g focus-events on

set-option -sa terminal-overrides ",xterm*:Tc"

############# HOTKEYS ############
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-F11 prev
bind -n M-F12 next
bind -n M-F8 kill-window

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-d kill-pane

bind -n C-F11 swap-window -t -1\; select-window -t -1
bind -n C-F12 swap-window -t +1\; select-window -t +1
bind -n M-k next
bind -n M-j prev

bind -n M-r source-file ~/.tmux.conf
set -sg escape-time 0

#bind -n M-Enter new-window -a -c ~/
bind -n M-Enter run-shell "~/.scripts/tmux/new_window.sh"
bind a run-shell "~/.scripts/tmux/new_session.sh"
bind r run-shell "bash ~/.scripts/tmux/rename_window.sh"
bind-key -n F4 run-shell "~/.scripts/tmux/switch_session.sh"
#bind d kill-session

set-hook -g window-unlinked 'run "~/.scripts/tmux/close_orphan_session.sh"'
set-hook -g session-closed 'run "~/.scripts/tmux/switch_session.sh on_close"'

#unbind-key Escape

##################################

set -g mouse on
set -g history-limit 1000
set-option -g allow-rename off
set -g default-terminal "tmux-256color"
#set -g default-terminal "xterm-256color"
set-option -g xterm-keys on
set-option -g detach-on-destroy off

#######################
#        THEME        #
#######################

## COLORSCHEME: gruvbox dark (medium)
set-option -g status "on"

# default statusbar color
#set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1
set-option -g status-style bg='#272e33',fg='#d3c6aa' # bg=bg1, fg=fg1

# default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1

# default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3

# active window title colors
set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1

# pane border
set-option -g pane-active-border-style fg=colour241 #fg2
set-option -g pane-border-style fg=colour238 #bg1

# message infos
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# pane number display
set-option -g display-panes-active-colour colour250 #fg2
set-option -g display-panes-colour colour237 #bg1

# clock
set-window-option -g clock-mode-colour colour109 #blue

# bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

set -g status-interval 1

## Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[bg=colour241,fg=colour248]#[bg=colour237,fg=colour241,nobold,noitalics,nounderscore]"
#set-option -g status-right "#[bg=colour237,fg=colour246]#(gitmux -cfg ~/.gitmux.conf #{pane_current_path}) #[bg=colour239,fg=colour248,nobold,noitalics,nounderscore]   #S "
#set-option -g status-right "#[bg=colour237,fg=colour246]#(~/.tmux/scripts/gitmux -cfg ~/.gitmux.conf #{pane_current_path}) #[bg=colour239,fg=colour248,nobold,noitalics,nounderscore]   #S "
set-option -g status-right "#[bg=#272e33,fg=colour246]#(~/.tmux/scripts/gitmux -cfg ~/.gitmux.conf #{pane_current_path}) #[bg=#272e33,fg=colour248,nobold,noitalics,nounderscore]   #S "

