live_config_reload = true

import = [
    "~/.config/alacritty/theme.toml",
    "~/.alacritty_local.toml"
]

[cursor]
blink_interval = 500
unfocused_hollow = false

[cursor.style]
blinking = "On"
shape = "Underline"

[env]
TERM = "xterm-256color"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[window]
dynamic_padding = true
dynamic_title = true

[window.dimensions]
columns = 120
lines = 15

[window.padding]
x = 0
y = 0
